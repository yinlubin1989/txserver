<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信通知使用与接口文档</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { max-width: 900px; margin: 40px auto; padding: 0 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.7; color: #1a1a1a; background: #fff; }
  pre { background: #f6f8fa; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
  code { font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; background: #f6f8fa; padding: 2px 6px; border-radius: 4px; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin: 16px 0; }
  th, td { border: 1px solid #ddd; padding: 10px 14px; text-align: left; }
  th { background: #f6f8fa; font-weight: 600; }
  h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
  h2 { margin-top: 32px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
  a { color: #0969da; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .nav { background: #f6f8fa; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 14px; }
  .nav a { margin-right: 16px; font-weight: 500; }
</style>
<script src="/docs/navigation.js" defer></script>
</head>
<body>
<div class="nav">
  <a href="/docs/">首页</a>
  <a href="/docs/frp.html">frp 内网穿透</a>
  <a href="/docs/frp-proxy.html">frp 代理配置</a>
  <a href="/docs/upload-api.html">图片上传接口</a>
  <a href="/docs/stories-backend-prompt.html">Stories 接口</a>
  <a href="http://82.157.107.78:8648/">Hermes Studio</a>
  <a href="/docs/ai-passport-intercom.html">对讲中继与后台</a>
  <a href="https://yinlubin.cn">主站</a>
</div>
<div id="content">加载中...</div>
<script>
const page = location.pathname.replace('/docs/', '') || 'index';
const file = page.endsWith('.html') ? page.replace('.html', '.md') : page + '.md';

async function loadNotifyCredentials() {
  const keyElement = document.querySelector('[data-wechat-notify-key]');
  const headerElement = document.querySelector('[data-wechat-notify-header]');
  if (!keyElement || !headerElement) return;

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch('/docs/wechat-notify-credentials.local.json', {
      cache: 'no-store', credentials: 'same-origin', signal: controller.signal,
    });
    if (!response.ok) throw new Error('Credentials unavailable');
    const credentials = await response.json();
    if (!credentials || typeof credentials !== 'object' || Array.isArray(credentials) ||
        credentials.schemaVersion !== 1 || credentials.status !== 'completed' ||
        typeof credentials.apiKey !== 'string' || credentials.apiKey.length < 32 ||
        /[\u0000-\u001f\u007f-\u009f]/.test(credentials.apiKey)) {
      throw new Error('Invalid credentials response');
    }
    keyElement.textContent = credentials.apiKey;
    headerElement.textContent = 'Authorization: Bearer ' + credentials.apiKey;
  } catch {
    keyElement.textContent = '未读取到接口密钥，请刷新页面重试。';
    headerElement.textContent = '未读取到 Authorization 请求头，请刷新页面重试。';
  } finally {
    clearTimeout(timeout);
  }
}

fetch('/docs/' + file, { cache: 'no-store' })
  .then(response => {
    if (!response.ok) throw new Error('Document unavailable');
    return response.text();
  })
  .then(async md => {
    document.getElementById('content').innerHTML = marked.parse(md);
    await loadNotifyCredentials();
    if (location.hash === '#notify-api-key') {
      document.getElementById('notify-api-key')?.scrollIntoView();
    }
  })
  .catch(() => { document.getElementById('content').innerHTML = '<p>文档加载失败</p>'; });
</script>
</body>
</html>
